[project]
name = "gabojago-data-import"
version = "0.1.0"
description = "TourAPI place bootstrap importer for GabojaGo"
requires-python = ">=3.11"
dependencies = [
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
gabojago-place-import = "gabojago_data_import.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
