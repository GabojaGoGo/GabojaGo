services:
  mysql:
    image: mysql:8.0
    container_name: gabojago-mysql
    environment:
      # backend/.env의 DB_PASSWORD를 MySQL과 Spring Boot가 함께 사용한다.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in backend/.env}
      MYSQL_DATABASE: gabojago
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  redis:
    image: redis:7.2
    container_name: gabojago-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - gabojago-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    container_name: gabojago-osrm
    restart: unless-stopped
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/yeongnam-car.osrm
    volumes:
      - ./infra/osrm/yeongnam/car:/data:ro
    expose:
      - "5000"
    networks:
      - app-network

  osrm-foot:
    profiles: ["walking"]
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    container_name: gabojago-osrm-foot
    restart: unless-stopped
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/yeongnam-foot.osrm
    volumes:
      - ./infra/osrm/yeongnam/foot:/data:ro
    expose:
      - "5000"
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gabojago-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - app-network
    env_file:
      - .env
    # Docker 내부 주소는 개발자별 환경값이 아니라 Compose 토폴로지다.
    # env_file보다 우선해 컨테이너에서 localhost를 바라보는 실수를 막는다.
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gabojago?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in backend/.env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OSRM_BASE_URL: http://osrm:5000
      OSRM_FOOT_BASE_URL: http://osrm-foot:5000

volumes:
  mysql-data:
  gabojago-redis-data:

networks:
  app-network:
