server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/gabojago?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        boot:
          allow_jdbc_metadata_access: false

# 장소 데이터는 Python 수집기가 적재한다. 런타임 호출은 축제 조회 전용이다.
tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_SERVICE_KEY}

kakao:
  client-id: ${KAKAO_REST_API_KEY}
  local-api-url: https://dapi.kakao.com
  direction-api-url: https://apis-navi.kakaomobility.com

jwt:
  secret: ${JWT_SECRET:local-test-jwt-secret-32-bytes-minimum-for-hs256-2026}
  access-expiry-ms: 900000
  refresh-expiry-ms: 1209600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
