server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        boot:
          allow_jdbc_metadata_access: false

tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  datalab-url: https://apis.data.go.kr/B551011/DataLabService
  service-key: ${TOUR_API_SERVICE_KEY}

congestion:
  sync:
    zone: Asia/Seoul
    cron: 0 50 23 * * *

kakao:
  client-id: ${KAKAO_REST_API_KEY}
  local-api-url: https://dapi.kakao.com
  direction-api-url: https://apis-navi.kakaomobility.com

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: 900000
  refresh-expiry-ms: 1209600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
