name: Verify

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend / check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gabojago-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew check --no-daemon

  frontend:
    name: Frontend / analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gabojago-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - name: Check changed Dart formatting
        working-directory: .
        run: make format-check
      - name: Check Flutter analyzer baseline
        working-directory: .
        run: make frontend-analyze
      - name: Run Flutter tests
        working-directory: .
        run: make frontend-test
